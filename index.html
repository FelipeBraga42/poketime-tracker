<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRO PokéTime Tracker</title>
  <style>
    :root {
      --bg: #181825;
      --card-bg: #1e1e2e;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --accent: #89b4fa;
      --teal: #94e2d5;
      --red: #f38ba8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
      border: 1px solid #313244;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .local-clock {
      font-size: 0.85rem;
      color: var(--subtext);
      margin-bottom: 12px;
    }

    /* --- RELÓGIO ANALÓGICO 24H --- */
    .analog-clock {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 6px solid #313244;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      margin-bottom: 16px;
      
      /* Mostrador 24 Horas
         Noite: 20:00 - 04:00 (300° a 60°)
         Manhã: 04:00 - 15:00 (60° a 225°)
         Tarde: 15:00 - 20:00 (225° a 300°)
      */
      background: conic-gradient(
        #121838 0deg 60deg,      /* Noite (00:00 - 04:00) */
        #b8860b 60deg 225deg,   /* Manhã (04:00 - 15:00) */
        #d4af37 225deg 300deg,  /* Tarde (15:00 - 20:00) */
        #121838 300deg 360deg   /* Noite (20:00 - 00:00) */
      );
    }

    /* Rótulos dos Horários */
    .hour-label {
      position: absolute;
      font-size: 0.7rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 1px 1px 3px #000;
      z-index: 2;
    }
    .label-0 { top: 8px; left: 50%; transform: translateX(-50%); color: #a6adc8; }
    .label-4 { top: 45px; right: 22px; color: #f9e2af; }
    .label-15 { bottom: 22px; right: 45px; color: #fab387; }
    .label-20 { bottom: 35px; left: 35px; color: #cba6f7; }

    /* Base dos Ponteiros */
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
    }

    /* Ponteiro das HORAS (Menor - Bege) */
    .hour-hand {
      width: 6px;
      height: 48px;
      background-color: #f5e0dc;
      margin-left: -3px;
      z-index: 3;
    }

    /* Ponteiro dos MINUTOS (Maior - Azul) */
    .minute-hand {
      width: 4px;
      height: 78px;
      background-color: var(--accent);
      margin-left: -2px;
      z-index: 4;
    }

    /* Ponteiro dos SEGUNDOS (Fino - Rosa) */
    .second-hand {
      width: 2px;
      height: 88px;
      background-color: var(--red);
      margin-left: -1px;
      z-index: 5;
    }

    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background-color: #cdd6f4;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    /* --- RELÓGIO DIGITAL --- */
    .poke-title {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--subtext);
      text-transform: uppercase;
    }

    .poke-clock {
      font-size: 2.2rem;
      font-weight: bold;
      color: #f9e2af;
      margin: 2px 0;
    }

    .phase-badge {
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .countdown {
      width: 100%;
      font-size: 0.85rem;
      color: var(--teal);
      background: rgba(148, 226, 213, 0.1);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(148, 226, 213, 0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>PRO PokéTime Tracker</h1>
    <div class="local-clock" id="localClock">Horário Local: --:--:--</div>

    <!-- Relógio Analógico 24h -->
    <div class="analog-clock">
      <div class="hour-label label-0">00:00</div>
      <div class="hour-label label-4">04:00</div>
      <div class="hour-label label-15">15:00</div>
      <div class="hour-label label-20">20:00</div>

      <div class="hand hour-hand" id="hourHand"></div>
      <div class="hand minute-hand" id="minuteHand"></div>
      <div class="hand second-hand" id="secondHand"></div>
      <div class="center-dot"></div>
    </div>

    <!-- Relógio Digital -->
    <div class="poke-title">PokéTime</div>
    <div class="poke-clock" id="pokeClock">--:--:--</div>
    <div class="phase-badge" id="phaseBadge">Carregando...</div>

    <div class="countdown" id="untilNextPhase">Próxima fase em: --h --m</div>
  </div>

  <script>
    // Âncora Sincronizada UTC
    const anchorReal = new Date("2025-05-29T21:00:00Z").getTime();
    const anchorProMinutes = 9 * 60; // 09:00 PRO

    function updateTime() {
      const now = new Date();
      document.getElementById('localClock').textContent = `Horário Local: ${now.toLocaleTimeString()}`;

      // Tempo decorrido
      const elapsedRealSeconds = (now.getTime() - anchorReal) / 1000;
      const elapsedProSeconds = elapsedRealSeconds * 5;
      const totalProMinutes = anchorProMinutes + (elapsedProSeconds / 60);

      // Normalização em 24h (1440 min)
      let proMinutesInDay = totalProMinutes % 1440;
      if (proMinutesInDay < 0) proMinutesInDay += 1440;

      const proHour = Math.floor(proMinutesInDay / 60);
      const proMinute = Math.floor(proMinutesInDay % 60);
      const proSecond = Math.floor(elapsedProSeconds % 60);

      // Atualiza o relógio digital
      const pad = (n) => String(n).padStart(2, '0');
      document.getElementById("pokeClock").textContent = `${pad(proHour)}:${pad(proMinute)}:${pad(proSecond)}`;

      // --- CÁLCULO DOS ÂNGULOS ---
      // 1. HORAS (Ponteiro Menor): 24h em 360° -> 15° por hora (0.25° por minuto)
      const anguloHoras = proMinutesInDay * 0.25;

      // 2. MINUTOS (Ponteiro Maior): 60m em 360° -> 6° por minuto
      const anguloMinutos = (proMinute + proSecond / 60) * 6;

      // 3. SEGUNDOS: 60s em 360° -> 6° por segundo
      const anguloSegundos = proSecond * 6;

      // Aplicação nos elementos corretos
      document.getElementById('hourHand').style.transform = `rotate(${anguloHoras}deg)`;
      document.getElementById('minuteHand').style.transform = `rotate(${anguloMinutos}deg)`;
      document.getElementById('secondHand').style.transform = `rotate(${anguloSegundos}deg)`;

      // Determinar Fases do Dia
      // Manhã: 04:00 às 15:00 | Tarde: 15:00 às 20:00 | Noite: 20:00 às 04:00
      let phase, nextPhaseHour, phaseColor;

      if (proHour >= 4 && proHour < 15) {
        phase = "Manhã 🌅";
        nextPhaseHour = 15;
        phaseColor = "#f9e2af";
      } else if (proHour >= 15 && proHour < 20) {
        phase = "Tarde ☀️";
        nextPhaseHour = 20;
        phaseColor = "#fab387";
      } else {
        phase = "Noite 🌙";
        nextPhaseHour = 4;
        phaseColor = "#cba6f7";
      }

      const badge = document.getElementById("phaseBadge");
      badge.textContent = phase;
      badge.style.color = phaseColor;

      // Contagem decrescente para a próxima fase
      const currentMinutes = proHour * 60 + proMinute;
      let nextPhaseMinutes = nextPhaseHour * 60;
      if (nextPhaseMinutes <= currentMinutes) nextPhaseMinutes += 1440;

      const untilNextPhase = nextPhaseMinutes - currentMinutes;
      const realNextPhaseSeconds = untilNextPhase * 12;

      const hrNext = Math.floor(realNextPhaseSeconds / 3600);
      const minNext = Math.floor((realNextPhaseSeconds % 3600) / 60);

      document.getElementById("untilNextPhase").textContent = 
        `Próxima fase em (real): ${hrNext}h ${minNext}m`;
    }

    updateTime();
    setInterval(updateTime, 100);
  </script>
</body>
</html>
