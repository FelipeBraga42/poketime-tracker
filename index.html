<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRO PokéTime Tracker</title>
  <style>
    :root {
      --bg: #181825;
      --card-bg: #1e1e2e;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --accent: #89b4fa;
      --morning: #b8860b;
      --day: #d4af37;
      --night: #121838;
      --teal: #94e2d5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
      border: 1px solid #313244;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .local-clock {
      font-size: 0.85rem;
      color: var(--subtext);
      margin-bottom: 16px;
    }

    /* --- RELÓGIO ANALÓGICO 24H --- */
    .analog-clock {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 6px solid #313244;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      margin-bottom: 16px;
      overflow: hidden;
      background: #11111b;
    }

    /* SVG do mostrador com fatias proporcionais a um relógio de 24h */
    .clock-dial {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg); /* Faz o 0° ficar no topo (00:00/24:00) */
    }

    /* Rótulos das horas nos pontos de transição exatos */
    .hour-label {
      position: absolute;
      font-size: 0.7rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      z-index: 2;
    }
    .label-0 { top: 8px; left: 50%; transform: translateX(-50%); color: #a6adc8; }
    .label-4 { top: 60px; right: 18px; color: #f9e2af; }
    .label-10 { bottom: 25px; right: 45px; color: #fab387; }
    .label-20 { bottom: 25px; left: 45px; color: #cba6f7; }

    /* Ponteiros */
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
      z-index: 3;
      transition: transform 0.05s linear;
    }

    .hour-hand {
      width: 6px;
      height: 55px;
      background-color: #f5e0dc;
      margin-left: -3px;
    }

    .minute-hand {
      width: 4px;
      height: 75px;
      background-color: var(--accent);
      margin-left: -2px;
    }

    .second-hand {
      width: 2px;
      height: 85px;
      background-color: #f38ba8;
      margin-left: -1px;
    }

    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background-color: #cdd6f4;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    /* --- RELÓGIO DIGITAL --- */
    .poke-title {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--subtext);
      text-transform: uppercase;
    }

    .poke-clock {
      font-size: 2.2rem;
      font-weight: bold;
      color: #f9e2af;
      margin: 2px 0;
    }

    .phase-badge {
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .countdown {
      width: 100%;
      font-size: 0.85rem;
      color: var(--teal);
      background: rgba(148, 226, 213, 0.1);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(148, 226, 213, 0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>PRO PokéTime Tracker</h1>
    <div class="local-clock" id="localClock">Horário Local: --:--:--</div>

    <!-- Relógio Analógico Proporcional às 24 Horas -->
    <div class="analog-clock">
      <svg class="clock-dial" viewBox="0 0 100 100">
        <!-- Manhã (04:00 às 10:00) -> 60° a 150° -->
        <path d="M 50 50 L 75 93.3 A 50 50 0 0 1 6.7 75 Z" fill="#b8860b" />
        <!-- Dia/Tarde (10:00 às 20:00) -> 150° a 300° -->
        <path d="M 50 50 L 6.7 75 A 50 50 0 0 1 6.7 25 Z" fill="#d4af37" />
        <!-- Noite (20:00 às 04:00) -> 300° a 60° -->
        <path d="M 50 50 L 6.7 25 A 50 50 0 1 1 75 93.3 Z" fill="#121838" />
      </svg>

      <!-- Marcadores de horas do relógio no mostrador -->
      <div class="hour-label label-0">00:00</div>
      <div class="hour-label label-4">04:00</div>
      <div class="hour-label label-10">10:00</div>
      <div class="hour-label label-20">20:00</div>

      <div class="hand hour-hand" id="hourHand"></div>
      <div class="hand minute-hand" id="minuteHand"></div>
      <div class="hand second-hand" id="secondHand"></div>
      <div class="center-dot"></div>
    </div>

    <!-- Relógio Digital -->
    <div class="poke-title">PokéTime</div>
    <div class="poke-clock" id="pokeClock">--:--:--</div>
    <div class="phase-badge" id="phaseBadge">Carregando...</div>

    <div class="countdown" id="countdown">Próxima fase em: --:--</div>
  </div>

  <script>
    // Marco zero UTC calculado com base na sua descoberta (17:00 EST = 09:00 PRO)
    const MARCO_ZERO_UTC_MS = Date.UTC(2024, 0, 1, 20, 12, 0);

    function obterDadosFase(horaPoke) {
      if (horaPoke >= 4 && horaPoke < 10) {
        return { nome: "Manhã 🌅", cor: "#f9e2af", proximaHora: 10 };
      } else if (horaPoke >= 10 && horaPoke < 20) {
        return { nome: "Dia / Tarde ☀️", cor: "#fab387", proximaHora: 20 };
      } else {
        return { nome: "Noite 🌙", cor: "#cba6f7", proximaHora: 4 };
      }
    }

    function atualizarRelogio() {
      const agora = new Date();
      
      // Exibe horário local no fuso do dispositivo do usuário
      document.getElementById('localClock').textContent = 
        `Horário Local: ${agora.toLocaleTimeString()}`;

      // Cálculo de tempo real para tempo do PRO (5x mais rápido)
      const msPassados = agora.getTime() - MARCO_ZERO_UTC_MS;
      const segundosReais = msPassados / 1000;
      const segundosPoke = segundosReais * 5;

      const totalSegundosDiaPoke = ((segundosPoke % (24 * 3600)) + (24 * 3600)) % (24 * 3600);

      const horaPoke = Math.floor(totalSegundosDiaPoke / 3600);
      const minutoPoke = Math.floor((totalSegundosDiaPoke % 3600) / 60);
      const segundoPoke = Math.floor(totalSegundosDiaPoke % 60);

      // Digital HH:MM:SS
      const hStr = String(horaPoke).padStart(2, '0');
      const mStr = String(minutoPoke).padStart(2, '0');
      const sStr = String(segundoPoke).padStart(2, '0');
      
      document.getElementById('pokeClock').textContent = `${hStr}:${mStr}:${sStr}`;

      // Analógico (360° / 24 horas = 15° por hora no mostrador)
      const anguloHoras = (horaPoke + minutoPoke / 60 + segundoPoke / 3600) * 15;
      const anguloMinutos = (minutoPoke + segundoPoke / 60) * 6;
      const anguloSegundos = segundoPoke * 6;

      document.getElementById('hourHand').style.transform = `rotate(${anguloHoras}deg)`;
      document.getElementById('minuteHand').style.transform = `rotate(${anguloMinutos}deg)`;
      document.getElementById('secondHand').style.transform = `rotate(${anguloSegundos}deg)`;

      // Fase do Dia
      const fase = obterDadosFase(horaPoke);
      const badge = document.getElementById('phaseBadge');
      badge.textContent = fase.nome;
      badge.style.color = fase.cor;

      // Contador Regressivo (Tempo Real)
      let segundosAlvoPoke = fase.proximaHora * 3600;
      if (segundosAlvoPoke <= totalSegundosDiaPoke) {
        segundosAlvoPoke += 24 * 3600;
      }

      const segundosPokeRestantes = segundosAlvoPoke - totalSegundosDiaPoke;
      const segundosReaisRestantes = Math.floor(segundosPokeRestantes / 5);

      const minReais = Math.floor(segundosReaisRestantes / 60);
      const segReais = segundosReaisRestantes % 60;

      const mRStr = String(minReais).padStart(2, '0');
      const sRStr = String(segReais).padStart(2, '0');

      document.getElementById('countdown').textContent = 
        `Próxima fase em (real): ${mRStr}m ${sRStr}s`;

      setTimeout(atualizarRelogio, 200);
    }

    atualizarRelogio();
  </script>
</body>
</html>
