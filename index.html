<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRO PokéTime Tracker</title>
  <style>
    :root {
      --bg: #181825;
      --card-bg: #1e1e2e;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --accent: #89b4fa;
      --yellow: #f9e2af;
      --orange: #fab387;
      --purple: #cba6f7;
      --teal: #94e2d5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Courier New', monospace; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { background-color: var(--card-bg); border-radius: 12px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); text-align: center; border: 1px solid #313244; }
    h1 { font-size: 1.4rem; color: var(--accent); margin-bottom: 16px; }
    .local-clock { font-size: 0.85rem; color: var(--subtext); margin-bottom: 16px; }
    .poke-title { font-size: 0.75rem; letter-spacing: 2px; color: var(--subtext); text-transform: uppercase; }
    .poke-clock { font-size: 2.4rem; font-weight: bold; color: var(--yellow); margin: 4px 0; }
    .phase-badge { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; }
    .countdown { font-size: 0.85rem; color: var(--teal); background: rgba(148, 226, 213, 0.1); padding: 8px; border-radius: 6px; border: 1px solid rgba(148, 226, 213, 0.2); }
  </style>
</head>
<body>

  <div class="container">
    <h1>PRO PokéTime Sync</h1>
    <div class="local-clock" id="localClock">Local (RJ): --:--:--</div>

    <div class="poke-title">PokéTime</div>
    <div class="poke-clock" id="pokeClock">--:--:--</div>
    <div class="phase-badge" id="phaseBadge">Carregando...</div>

    <div class="countdown" id="countdown">Próxima fase em: --:--</div>
  </div>

  <script>
    // Ponto de referência zero (Epoch) do servidor do PRO em milissegundos
    // (Data histórica em UTC onde o Pokétime marcou exatamente 00:00:00)
    const PRO_EPOCH_MS = 1443657600000; 

    function obterDadosFase(horaPoke) {
      if (horaPoke >= 4 && horaPoke < 10) {
        return { nome: "Manhã 🌅", cor: "var(--yellow)", proximaHora: 10 };
      } else if (horaPoke >= 10 && horaPoke < 20) {
        return { nome: "Tarde ☀️", cor: "var(--orange)", proximaHora: 20 };
      } else {
        return { nome: "Noite 🌙", cor: "var(--purple)", proximaHora: 4 };
      }
    }

    function atualizarRelogio() {
      const agora = new Date();
      
      // Relógio Local
      document.getElementById('localClock').textContent = 
        `Local (RJ): ${agora.toLocaleTimeString('pt-BR')}`;

      // Cálculo do tempo total decorrido desde o ponto zero (5x mais rápido)
      const msPassados = agora.getTime() - PRO_EPOCH_MS;
      const segundosReais = msPassados / 1000;
      const segundosPoke = segundosReais * 5;

      const totalSegundosDiaPoke = (segundosPoke) % (24 * 3600);

      const horaPoke = Math.floor(totalSegundosDiaPoke / 3600);
      const minutoPoke = Math.floor((totalSegundosDiaPoke % 3600) / 60);
      const segundoPoke = Math.floor(totalSegundosDiaPoke % 60);

      // Exibição HH:MM:SS
      const hStr = String(horaPoke).padStart(2, '0');
      const mStr = String(minutoPoke).padStart(2, '0');
      const sStr = String(segundoPoke).padStart(2, '0');
      
      document.getElementById('pokeClock').textContent = `${hStr}:${mStr}:${sStr}`;

      // Fase do Dia
      const fase = obterDadosFase(horaPoke);
      const badge = document.getElementById('phaseBadge');
      badge.textContent = fase.nome;
      badge.style.color = fase.cor;

      // Regressiva
      let segundosAlvoPoke = fase.proximaHora * 3600;
      if (segundosAlvoPoke <= totalSegundosDiaPoke) {
        segundosAlvoPoke += 24 * 3600;
      }

      const segundosPokeRestantes = segundosAlvoPoke - totalSegundosDiaPoke;
      const segundosReaisRestantes = Math.floor(segundosPokeRestantes / 5);

      const minReais = Math.floor(segundosReaisRestantes / 60);
      const segReais = segundosReaisRestantes % 60;

      const mRStr = String(minReais).padStart(2, '0');
      const sRStr = String(segReais).padStart(2, '0');

      document.getElementById('countdown').textContent = 
        `Próxima fase em (real): ${mRStr}m ${sRStr}s`;

      setTimeout(atualizarRelogio, 1000);
    }

    atualizarRelogio();
  </script>
</body>
</html>
