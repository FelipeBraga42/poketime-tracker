<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRO PokéTime Tracker</title>
  <style>
    :root {
      --bg: #181825;
      --card-bg: #1e1e2e;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --accent: #89b4fa;
      --teal: #94e2d5;
      --red: #f38ba8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
      border: 1px solid #313244;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .local-clock {
      font-size: 0.85rem;
      color: var(--subtext);
      margin-bottom: 12px;
    }

    /* --- RELÓGIO ANALÓGICO 24H --- */
    .analog-clock {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 6px solid #313244;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      margin-bottom: 16px;
      overflow: hidden;
      background: #11111b;
    }

    .clock-dial {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg); /* 00:00 no topo */
    }

    .hour-label {
      position: absolute;
      font-size: 0.7rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000;
      z-index: 2;
    }
    .label-0 { top: 8px; left: 50%; transform: translateX(-50%); color: #a6adc8; }
    .label-4 { top: 60px; right: 18px; color: #f9e2af; }
    .label-15 { bottom: 18px; right: 80px; color: #fab387; }
    .label-20 { bottom: 25px; left: 45px; color: #cba6f7; }

    /* Ponteiros */
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
      z-index: 3;
      transition: transform 0.05s linear;
    }

    .hour-hand {
      width: 6px;
      height: 55px;
      background-color: #f5e0dc;
      margin-left: -3px;
    }

    .minute-hand {
      width: 4px;
      height: 75px;
      background-color: var(--accent);
      margin-left: -2px;
    }

    .second-hand {
      width: 2px;
      height: 85px;
      background-color: var(--red);
      margin-left: -1px;
    }

    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background-color: #cdd6f4;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    /* --- RELÓGIO DIGITAL --- */
    .poke-title {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--subtext);
      text-transform: uppercase;
    }

    .poke-clock {
      font-size: 2.2rem;
      font-weight: bold;
      color: #f9e2af;
      margin: 2px 0;
    }

    .phase-badge {
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .countdown {
      width: 100%;
      font-size: 0.85rem;
      color: var(--teal);
      background: rgba(148, 226, 213, 0.1);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(148, 226, 213, 0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>PRO PokéTime Tracker</h1>
    <div class="local-clock" id="localClock">Horário Local: --:--:--</div>

    <!-- Relógio Analógico 24h com fatias atualizadas -->
    <div class="analog-clock">
      <svg class="clock-dial" viewBox="0 0 100 100">
        <!-- Manhã (04:00 às 14:59) -> 60° a 225° -->
        <path d="M 50 50 L 93.3 25 A 50 50 0 0 1 14.6 85.4 Z" fill="#b8860b" />
        
        <!-- Tarde (15:00 às 19:59) -> 225° a 300° -->
        <path d="M 50 50 L 14.6 85.4 A 50 50 0 0 1 6.7 25 Z" fill="#d4af37" />
        
        <!-- Noite (20:00 às 03:59) -> 300° a 60° -->
        <path d="M 50 50 L 6.7 25 A 50 50 0 0 1 93.3 25 Z" fill="#121838" />
      </svg>

      <div class="hour-label label-0">00:00</div>
      <div class="hour-label label-4">04:00</div>
      <div class="hour-label label-15">15:00</div>
      <div class="hour-label label-20">20:00</div>

      <div class="hand hour-hand" id="hourHand"></div>
      <div class="hand minute-hand" id="minuteHand"></div>
      <div class="hand second-hand" id="secondHand"></div>
      <div class="center-dot"></div>
    </div>

    <!-- Relógio Digital -->
    <div class="poke-title">PokéTime</div>
    <div class="poke-clock" id="pokeClock">--:--:--</div>
    <div class="phase-badge" id="phaseBadge">Carregando...</div>

    <div class="countdown" id="untilNextPhase">Próxima fase em: --h --m</div>
  </div>

  <script>
    // Âncora Universal Sincronizada (UTC)
    const anchorReal = new Date("2025-05-29T21:00:00Z");
    const anchorProMinutes = 9 * 60; // 09:00 PRO

    function updateTime() {
      const now = new Date();
      document.getElementById('localClock').textContent = `Horário Local: ${now.toLocaleTimeString()}`;

      // Cálculo de tempo exato
      const elapsedRealSeconds = (now - anchorReal) / 1000;
      const elapsedProSeconds = elapsedRealSeconds * 5;
      const totalProMinutes = anchorProMinutes + Math.floor(elapsedProSeconds / 60);
      
      const proHour = Math.floor((totalProMinutes / 60) % 24);
      const proMinute = totalProMinutes % 60;
      const proSecond = Math.floor(elapsedProSeconds % 60);

      // Atualiza o relógio digital
      const pad = (n) => String(n).padStart(2, '0');
      document.getElementById("pokeClock").textContent = `${pad(proHour)}:${pad(proMinute)}:${pad(proSecond)}`;

      // Atualiza os ponteiros do relógio analógico (15° por hora num mostrador de 24h)
      const anguloHoras = (proHour + proMinute / 60 + proSecond / 3600) * 15;
      const anguloMinutos = (proMinute + proSecond / 60) * 6;
      const anguloSegundos = proSecond * 6;

      document.getElementById('hourHand').style.transform = `rotate(${anguloHoras}deg)`;
      document.getElementById('minuteHand').style.transform = `rotate(${anguloMinutos}deg)`;
      document.getElementById('secondHand').style.transform = `rotate(${anguloSegundos}deg)`;

      // Determinação das Fases (Ajustadas às suas definições)
      let phase, nextPhaseHour, phaseColor;

      if (proHour >= 4 && proHour < 15) {
        phase = "Manhã 🌅";
        nextPhaseHour = 15;
        phaseColor = "#f9e2af";
      } else if (proHour >= 15 && proHour < 20) {
        phase = "Tarde ☀️";
        nextPhaseHour = 20;
        phaseColor = "#fab387";
      } else {
        phase = "Noite 🌙";
        nextPhaseHour = 4;
        phaseColor = "#cba6f7";
      }

      const badge = document.getElementById("phaseBadge");
      badge.textContent = phase;
      badge.style.color = phaseColor;

      // Cálculo do tempo restante para a próxima fase (1 min no jogo = 12 seg reais)
      const currentMinutes = proHour * 60 + proMinute;
      let nextPhaseMinutes = nextPhaseHour * 60;
      if (nextPhaseMinutes <= currentMinutes) nextPhaseMinutes += 1440;

      const untilNextPhase = nextPhaseMinutes - currentMinutes;
      const realNextPhaseSeconds = untilNextPhase * 12;

      const hrNext = Math.floor(realNextPhaseSeconds / 3600);
      const minNext = Math.floor((realNextPhaseSeconds % 3600) / 60);

      document.getElementById("untilNextPhase").textContent = 
        `Próxima fase em (real): ${hrNext}h ${minNext}m`;
    }

    updateTime();
    setInterval(updateTime, 200);
  </script>
</body>
</html>
